<style>
  [data-theme="dark"] body,
  [data-theme="dark"] .wrapper {
    background-color: #0d1117 !important;
    color: #c9d1d9 !important;
  }
  [data-theme="dark"] a { color: #58a6ff !important; }
  [data-theme="dark"] h1, [data-theme="dark"] h2,
  [data-theme="dark"] h3, [data-theme="dark"] h4,
  [data-theme="dark"] h5, [data-theme="dark"] h6,
  [data-theme="dark"] strong { color: #e6edf3 !important; }
  [data-theme="dark"] code, [data-theme="dark"] pre {
    background-color: #161b22 !important;
    color: #e6edf3 !important;
    border-color: #30363d !important;
  }
  [data-theme="dark"] pre code { border: none !important; }
  [data-theme="dark"] table th {
    background-color: #161b22 !important;
    color: #e6edf3 !important;
    border-color: #30363d !important;
  }
  [data-theme="dark"] table td { border-color: #30363d !important; }
  [data-theme="dark"] table tr:nth-child(2n) { background-color: #161b22 !important; }
  [data-theme="dark"] table tr:nth-child(2n+1) { background-color: #0d1117 !important; }
  [data-theme="dark"] hr { border-color: #30363d !important; }
  [data-theme="dark"] blockquote { border-left-color: #30363d !important; color: #8b949e !important; }
  [data-theme="dark"] header { border-right-color: #30363d !important; }
  [data-theme="dark"] header h1 a { color: #e6edf3 !important; }
  [data-theme="dark"] header p.view a { color: #58a6ff !important; }
  [data-theme="dark"] header p { color: #8b949e !important; }
  [data-theme="dark"] small { color: #8b949e !important; }
  [data-theme="dark"] li::marker { color: #8b949e !important; }

  /* hide the footer lines the theme injects */
  body > .wrapper > footer,
  body > .wrapper > section ~ p:last-of-type,
  small:last-child {
    display: none !important;
  }

  #theme-toggle {
    position: fixed;
    top: 10px;
    right: 14px;
    background-color: #e1e4e8;
    color: #24292e;
    border: 1px solid #d1d5da;
    font-size: 18px;
    cursor: pointer;
    z-index: 999;
    padding: 5px 10px;
    border-radius: 8px;
    line-height: 1;
  }
  #theme-toggle:hover {
    background-color: #d1d5da;
  }
  [data-theme="dark"] #theme-toggle {
    background-color: #21262d !important;
    color: #c9d1d9 !important;
    border-color: #30363d !important;
  }
  [data-theme="dark"] #theme-toggle:hover {
    background-color: #30363d !important;
  }

  .demo-img {
    display: block;
    margin: 20px auto;
    max-width: 100%;
    border-radius: 6px;
  }
</style>
<script>
  (function() {
    function get() {
      var s = localStorage.getItem('uft-theme');
      if (s) return s;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', get());
  })();
</script>
